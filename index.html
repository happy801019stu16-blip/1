<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#124b59"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>消防安全設備會勘查驗助手</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f4;color:#17343b;font:16px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:14px}header{background:#124b59;color:white;padding:22px;border-radius:16px}h1{font-size:23px;margin:0}h2{font-size:18px;border-left:5px solid #168a87;padding-left:9px}section{background:white;border-radius:14px;padding:16px;margin:12px 0}label{display:block;font-size:14px;margin:10px 0 4px}input{width:100%;padding:11px;border:1px solid #b9c9ca;border-radius:9px;font-size:16px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#e7f3f1;padding:12px;border-radius:8px;margin-top:12px;line-height:1.8}button{background:#126b70;color:white;border:0;border-radius:9px;padding:12px;margin:4px;font-size:15px;cursor:pointer}button.secondary{background:#52676d}small{color:#52676d}#clock{font-size:40px;font-weight:bold;font-variant-numeric:tabular-nums}article{border-bottom:1px solid #ddd;padding:8px 0;overflow-wrap:anywhere} @media(max-width:360px){.grid{grid-template-columns:1fr}}</style><main><header><h1>消防安全設備會勘查驗助手</h1><p>泡沫滅火設備 · V1.0</p></header><section><h2>案件資料</h2><label for="name">案名</label><input id="name"><label for="date">查驗日期</label><input id="date" type="date"></section><section><h2>泡沫混合濃度</h2><div class="grid"><div><label for="raw">原液儀器讀值</label><input id="raw" type="number" step="any" min="0" value="14.5"></div><div><label for="mix">混合液實測讀值</label><input id="mix" type="number" step="any" min="0"></div></div><div class="result" id="con"></div></section><section><h2>發泡倍率及還原量</h2><div class="grid" id="cups"></div></section><section><h2>60秒計時器</h2><div id="clock">01:00</div><button id="start">開始</button><button id="stop" class="secondary">停止</button><button id="reset" class="secondary">重設</button><p id="timerStatus" role="status"></p></section><section><h2>查驗紀錄</h2><button id="save">儲存本次紀錄</button><button id="export">匯出 CSV</button><button id="clear" class="secondary">清除輸入</button><p id="status" role="status"></p><div id="history"></div></section><section><small>試算工具：混合濃度依比例換算（假設零點為0且線性），3–4%為本版預設參考區間；發泡倍率以混合液密度1 g/mL估算。60秒還原量僅呈現與25%目標的比較，不代表法規合格判定。正式查驗須依適用法規、設備及儀器校正資料確認。資料僅存於本機瀏覽器，請定期匯出備份。</small></section></main><script>
const $=id=>document.getElementById(id); const fields=['vol','empty','gross','drain']; const labels=['量杯容量（mL）','空杯重量（g）','採樣總重（g）','60秒還原量（g）']; for(const c of ['A','B']){$('cups').insertAdjacentHTML('beforeend',`<div><strong>量杯 ${c}</strong>${fields.map((f,i)=>`<label for="${c+f}">${labels[i]}</label><input id="${c+f}" type="number" min="0" step="any" value="${i===0?1000:''}">`).join('')}<div class="result" id="res${c}"></div></div>`)} const num=id=>$(id).value.trim()===''?null:Number($(id).value); const ok=x=>x!==null&&Number.isFinite(x)&&x>=0; const fmt=(x,n=2)=>x===null?'待測':x.toFixed(n); function calc(){let r=num('raw'),m=num('mix'),p=ok(r)&&r>0&&ok(m)?m/r*100:null; $('con').textContent=`3–4% 對應讀值：${ok(r)&&r>0?fmt(r*.03,3)+' ～ '+fmt(r*.04,3):'待測'}\n混合濃度：${fmt(p,3)}${p===null?'':'%（'+(p>=3&&p<=4?'區間內':'區間外')+'）'}`;$('con').style.whiteSpace='pre-line';let out={案名:$('name').value,日期:$('date').value,原液讀值:r,混合液讀值:m,混合濃度:p};for(const c of ['A','B']){let [v,e,g,d]=fields.map(f=>num(c+f));let n=[v,e,g].every(ok)&&v>0&&g>e?g-e:null;let ratio=n!==null?v/n:null,t=n===null?null:n*.25,dp=n!==null&&ok(d)&&d<=n?d/n*100:null;let msg=n===null?'請確認容量與重量':d===null?'尚未提供還原量':dp===null?'還原量異常':d<t?'60秒尚未達25%還原量':'60秒已達25%還原量';$('res'+c).innerText=`泡沫淨重：${fmt(n)} g\n發泡倍率：${fmt(ratio)} 倍\n25%目標：${fmt(t)} g\n還原比例：${fmt(dp)} %\n${msg}`;Object.assign(out,{[c+'容量']:v,[c+'空杯']:e,[c+'總重']:g,[c+'還原量']:d,[c+'淨重']:n,[c+'倍率']:ratio,[c+'目標']:t,[c+'還原比例']:dp,[c+'判定']:msg})}return out}document.addEventListener('input',calc);function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}$('date').value=today();calc();let remaining=60000,end=0,tick=null;function render(){let s=Math.ceil(remaining/1000);$('clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function update(){remaining=Math.max(0,end-Date.now());render();if(!remaining){clearInterval(tick);tick=null;$('timerStatus').textContent='60秒已到，請記錄還原量。';if(navigator.vibrate)navigator.vibrate(300)}}$('start').onclick=()=>{if(tick||!remaining)return;end=Date.now()+remaining;tick=setInterval(update,100);$('timerStatus').textContent='計時中'};$('stop').onclick=()=>{if(tick){update();clearInterval(tick);tick=null;if(remaining)$('timerStatus').textContent='已停止'}};$('reset').onclick=()=>{clearInterval(tick);tick=null;remaining=60000;render();$('timerStatus').textContent=''};let records=[];try{records=JSON.parse(localStorage.getItem('fireRecords')||'[]')}catch(e){}function show(){ $('history').replaceChildren();records.forEach((r,i)=>{let a=document.createElement('article');a.textContent=`${r.日期}｜${r.案名||'未命名'}｜A倍率 ${fmt(r.A倍率)}｜B倍率 ${fmt(r.B倍率)}`;let b=document.createElement('button');b.textContent='刪除';b.onclick=()=>{if(confirm('刪除此筆紀錄？')){let next=records.filter((_,j)=>i!==j);try{localStorage.setItem('fireRecords',JSON.stringify(next));records=next;show()}catch(e){$('status').textContent='儲存失敗'}}};a.append(b);$('history').append(a)})}show();$('save').onclick=()=>{let next=[calc(),...records];try{localStorage.setItem('fireRecords',JSON.stringify(next));records=next;show();$('status').textContent='已儲存至本機'}catch(e){$('status').textContent='儲存失敗，請確認瀏覽器設定'}};$('export').onclick=()=>{let rows=records.length?records:[calc()];let keys=Object.keys(rows[0]);let esc=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';let csv='\ufeff'+[keys.map(esc).join(','),...rows.map(r=>keys.map(k=>esc(r[k])).join(','))].join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='泡沫查驗紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('clear').onclick=()=>{if(confirm('清除目前輸入？已儲存紀錄不受影響。')){document.querySelectorAll('input').forEach(x=>x.value='');$('date').value=today();$('raw').value=14.5;$('Avol').value=$('Bvol').value=1000;calc();$('reset').click()}};if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{$('status').textContent='離線快取尚未啟用'});
</script></html>
